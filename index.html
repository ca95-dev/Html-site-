<!DOCTYPE html>
<html>
<head>
    <title>Web Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
        }
        header {
            background: darkblue;
            color: white;
            padding: 10px;
        }
        input {
            width: 300px;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
        }
        #search {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Web Page</h1>
    </header>
    <div id="search">
        <input id="box" placeholder="Type Any Website Name">
        <button onclick="go()"> Go </button>
        <h2 id="result"></h2>
    </div>
    <script>
        function go()
        {
            var text = document.getElementById("box").value.trim().toLowerCase();
            var url;

            if (text == "")
            {
                return;
            }
            else if (text.includes("."))
            {
                url = "https://" + text;
            }
            else
            {
                url = "https://" + text + ".com";
            }

            fetch(url)
                .then(function(response)
                {
                    document.getElementById("result").innerHTML = response.status + " " + response.statusText;
                })
                .catch(function()
                {
                    document.getElementById("result").innerHTML = "Code not available";
                })
                .finally(function()
                {
                    setTimeout(function()
                    {
                        window.location.href = url;
                    }, 3000);
                });
        }
    </script>
</body>
</html>
