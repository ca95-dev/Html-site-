<!DOCTYPE html>
<html>
<head>
    <title>My Browser</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        #bar {
            background: #ddd;
            padding: 10px;
            text-align: center;
        }
        input {
            width: 60%;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        iframe {
            width: 100%;
            height: 90vh;
            border: none;
        }
    </style>
</head>
<body>

    <div id="bar">
        <input type="text" id="box" placeholder="Type a website or anything...">
        <button onclick="go()">Go</button>
    </div>

    <iframe id="screen" src="https://en.wikipedia.org"></iframe>

    <script>
        function go() {
            var text = document.getElementById("box").value.trim();
            if (text == "") return;
            var url;
            if (text.includes(".") && !text.includes(" ")) {
                url = text.startsWith("http") ? text : "https://" + text;
            }
            else {
                url = "https://en.wikipedia.org/w/index.php?search=" + encodeURIComponent(text);
            }

            document.getElementById("screen").src = url;
        }

        document.getElementById("box").addEventListener("keypress", function(e) {
            if (e.key == "Enter") go();
        });
    </script>

</body>
</html>
