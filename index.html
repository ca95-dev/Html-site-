<!DOCTYPE html>
<html>
<head>
    <title>Web Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            text-align: center;
        }
        header {
            background: darkblue;
            color: white;
            padding: 10px;
        }
        input {
            width: 300px;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
        }
        #search {
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Web Page</h1>
    </header>
    <div id="search">
        <input id="box" placeholder="Type Any Website Name">
        <button onclick="go()"> Go </button>
    </div>
    <script>
        function go()
        {
            var text = document.getElementById("box").value.trim().toLowerCase();

            if (text == "")
            {
                return;
            }
            else if (text.includes("."))
            {
                window.location.href = "https://" + text;
            }
            else
            {
                window.location.href = "https://" + text + ".com";
            }
        }
    </script>
</body>
</html>
